function catalogEditor(entity,row={}){const p=editor(entity==='Menus'?'メニュー編集':'スタッフ編集'),f=el('form','','fields');p.append(f);input(f,'id','ID（既存データは変更不可）',row.id||'').readOnly=true;input(f,'name','名称',row.name).required=true;if(entity==='Menus'){input(f,'description','内容',row.description,'textarea');input(f,'price','税込価格（円）',row.price||0,'number').min=0;input(f,'minutes','所要時間（分）',row.minutes||60,'number').min=15;}else{input(f,'role','肩書き',row.role);input(f,'bio','紹介',row.bio,'textarea');input(f,'fee','指名料（税込・円）',row.fee||0,'number').min=0;input(f,'weeklyOff','個人定休日（0=日〜6=土、例：2,3）',row.weeklyOff||'');const box=el('div','','field full');box.append(el('span','対応メニュー'));data.menus.forEach(m=>{const l=el('label','','check'),c=el('input');c.type='checkbox';c.value=m.id;c.dataset.menu='true';c.checked=String(row.menuIds||'').split(',').includes(m.id);l.append(c,el('span',m.name+(yes(m.active)?'':'（非公開）')));box.append(l);});f.append(box);}input(f,'active','公開する',row.active===undefined?true:row.active,'checkbox');const b=el('button','保存','btn');b.type='submit';f.append(b,button('閉じる',()=>p.remove()));f.onsubmit=e=>{e.preventDefault();const o=formValues(f);if(entity==='Staff')o.menuIds=[...f.querySelectorAll('[data-menu]:checked')].map(x=>x.value).join(',');action(()=>api('adminSave',entity,o));};}
function holidayEditor(){const p=editor('休業日を追加'),f=el('form','','fields');p.append(f);input(f,'date','休業日','','date').required=true;input(f,'staffId','対象','','select',[['','店舗全体'],...data.staff.map(x=>[x.id,x.name])]);input(f,'note','備考','');const b=el('button','休業日を保存','btn');b.type='submit';f.append(b);f.onsubmit=e=>{e.preventDefault();action(()=>api('adminSave','Holidays',formValues(f)));};}
function reservationEditor(r){const p=editor('予約の変更'),f=el('form','','fields');p.append(el('p',r.name+' 様 ／ '+r.email));p.append(el('p','変更すると現行メニュー料金で再計算し、お客様へメールを送信します。','hint'));p.append(f);input(f,'date','日付',r.date,'date').required=true;input(f,'time','開始時間',r.time,'time').required=true;input(f,'staffId','担当',r.staffId,'select',data.staff.filter(x=>yes(x.active)).map(x=>[x.id,x.name]));const box=el('div','','field full');data.menus.filter(x=>yes(x.active)).forEach(m=>{const l=el('label','','check'),c=el('input');c.type='checkbox';c.dataset.menu='true';c.value=m.id;c.checked=String(r.menuIds).split(',').includes(m.id);l.append(c,el('span',m.name+' / ¥'+m.price+' / '+m.minutes+'分'));box.append(l);});f.append(box);const b=el('button','変更して通知','btn');b.type='submit';f.append(b,button('閉じる',()=>p.remove()));f.onsubmit=e=>{e.preventDefault();const o={...formValues(f),id:r.id,version:r.version,menuIds:[...f.querySelectorAll('[data-menu]:checked')].map(x=>x.value)};const staff=data.staff.find(x=>x.id===o.staffId);const total=data.menus.filter(x=>o.menuIds.includes(x.id)).reduce((n,x)=>n+Number(x.price),Number(staff?.fee||0));if(confirm('変更後の料金は ¥'+total.toLocaleString('ja-JP')+' です。変更して通知しますか？'))action(()=>api('adminChangeReservation',o));};}
function render(){const tabs=$('tabs');tabs.replaceChildren();['予約','メニュー','スタッフ','休業日','店舗設定'].forEach(x=>{const b=button(x,()=>{tab=x;$('message').hidden=true;render();});b.classList.toggle('active',tab===x);tabs.append(b);});tabs.append(button('再読み込み',()=>refresh().catch(e=>msg(e.message,true))));const c=$('content');c.replaceChildren();if(tab==='予約'){c.append(el('p','予約変更・キャンセル時はお客様へメールを送信します。送信済みの再送は、届いていない場合だけ行ってください。','hint'));const filter=el('div','','fields');const date=input(filter,'filterDate','日付で絞り込み','','date');const search=input(filter,'search','氏名・メール・予約番号で検索','');c.append(filter);const list=el('div');c.append(list);function draw(){list.replaceChildren(table(['日時 / 状態','お客様','メニュー / 担当','料金','メール','操作'],data.reservations.filter(r=>(!date.value||r.date===date.value)&&(!search.value||(r.name+' '+r.email+' '+r.id).toLowerCase().includes(search.value.toLowerCase()))),r=>{const ops=el('div');if(r.status==='confirmed'){ops.append(button('変更',()=>reservationEditor(r)),button('キャンセル',()=>{if(confirm(r.name+' 様の予約をキャンセルして通知しますか？'))action(()=>api('adminChangeReservation',{id:r.id,version:r.version,cancel:true}));}));}ops.append(button('メール再送',()=>{if(confirm('この予約の通知メールを再送しますか？'))action(()=>api('adminResend',r.id));}));return [r.date+' '+r.time+'〜'+r.endTime+' / '+(r.status==='confirmed'?'確定':'キャンセル'),r.name+'\n'+r.email+'\n'+r.phone+'\n備考：'+r.memo,r.menuNames+' / '+r.staffName,'¥'+r.price,r.mailStatus,ops];}));}date.onchange=draw;search.oninput=draw;draw();}
else if(tab==='メニュー'||tab==='スタッフ'){const menu=tab==='メニュー',items=menu?data.menus:data.staff,entity=menu?'Menus':'Staff';c.append(button('＋ 新規追加',()=>catalogEditor(entity)));c.append(table(menu?['名称','価格','時間','公開','操作']:['名前','肩書き','指名料','公開','操作'],items,r=>[r.name,menu?'¥'+r.price:r.role,menu?r.minutes+'分':'¥'+r.fee,yes(r.active)?'公開':'非公開',button('編集',()=>catalogEditor(entity,r))]));c.append(el('p','削除の代わりに「公開する」をオフにします。既存予約の記録・料金は保持されます。スタッフを非公開にしても既存予約は残ります。','hint'));}
else if(tab==='休業日'){c.append(button('＋ 休業日を追加',holidayEditor));c.append(table(['日付','対象','備考','操作'],data.holidays,r=>[r.date,r.staffId?(data.staff.find(x=>x.id===r.staffId)?.name||r.staffId):'店舗全体',r.note,button('削除',()=>{if(confirm('この休業日設定を削除しますか？'))action(()=>api('adminDeleteHoliday',r.id));})]));}
else {const f=el('form','','fields');c.append(el('p','営業時間や定休日の変更は、新規受付に適用します。既存予約は自動変更されません。変更前に予約一覧をご確認ください。','hint'),f);const labels={shopName:'店舗名',tagline:'メインコピー',description:'店舗紹介',address:'住所',access:'アクセス',contactEmail:'問い合わせメール',phone:'店舗電話',open:'開店時間',close:'閉店時間',weeklyOff:'定休日（0=日〜6=土、例：2）',interval:'予約開始の間隔（分）',daysAhead:'何日先まで受付するか',leadHours:'何時間前まで受付するか',privacy:'個人情報の取扱い',cancellation:'変更・キャンセル方針',notice:'お知らせ'};Object.keys(labels).forEach(k=>input(f,k,labels[k],data.settings[k],['description','privacy','cancellation','notice','access'].includes(k)?'textarea':['open','close'].includes(k)?'time':['interval','daysAhead','leadHours'].includes(k)?'number':k==='contactEmail'?'email':'text'));input(f,'bookingEnabled','オンライン予約を受け付ける',data.settings.bookingEnabled,'checkbox');const b=el('button','設定を保存','btn');b.type='submit';f.append(b);f.onsubmit=e=>{e.preventDefault();action(()=>api('adminSettings',formValues(f)));};}}
refresh().catch(e=>msg(e.message||String(e),true));

})();
</script></body></html>
